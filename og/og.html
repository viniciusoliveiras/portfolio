<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>OG card source</title>
		<!--
			SOURCE OF `public/og.png` — 1200×630, locale-neutral.

			Like the résumé, this had no source in the repo: the card was rendered once by
			a throwaway script and only the PNG survived, so the author's name could not be
			corrected without redrawing it from scratch. Authored here for the same reason.

			Rendered with `node og/build.mjs`. A ONE-OFF step producing a committed binary,
			on the token layer §6 font-vendoring footing: not part of the app build, no
			`package.json` entry, no CI job, no new dependency.

			It loads THE SITE'S OWN SUBSET `woff2` FILES from `public/fonts/`, so the card
			is set in the same type the page is rather than a lookalike — and it cannot
			drift from the site's typography, because there is only one copy of each face.

			LOCALE-NEUTRAL BY CONSTRUCTION, which is what lets one card serve both routes:
			`Tech Lead` is the title used in Portuguese too — head-and-metadata §6 keeps
			`jobTitle` invariant for exactly that reason — and `Rio de Janeiro` is spelled
			identically in both locales. No other string appears. Do not add one that would
			need translating.
		-->
		<style>
			@font-face {
				font-family: "Source Serif 4";
				font-style: normal;
				font-weight: 400 600;
				src: url("../public/fonts/roman.woff2") format("woff2");
			}

			@font-face {
				font-family: "JetBrains Mono";
				font-style: normal;
				font-weight: 500;
				src: url("../public/fonts/mono.woff2") format("woff2");
			}

			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			/* The exact card size. `build.mjs` screenshots this element, so the viewport
			   and the artwork cannot disagree. */
			body {
				width: 1200px;
				height: 630px;
				/* `paper` and `ink`, light mode — a social card has no colour scheme to
				   follow, so the canonical mode is the only sensible one. */
				background: #faf9f7;
				color: #1a1a1a;
				display: flex;
				flex-direction: column;
				justify-content: center;
				padding: 0 100px;
				font-family: "Source Serif 4", serif;
			}

			.role {
				font-family: "JetBrains Mono", monospace;
				font-weight: 500;
				font-size: 26px;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: #545454; /* muted */
			}

			h1 {
				font-size: 112px;
				font-weight: 400;
				line-height: 1.05;
				/* The `hero` role's optical size — the largest cut, as on the page. */
				font-variation-settings: "opsz" 60;
				margin: 34px 0 0;
			}

			/* The closing device, echoing the page's section rules. */
			.rule {
				width: 200px;
				height: 4px;
				background: #b3261e; /* accent */
				margin-top: 52px;
			}
		</style>
	</head>
	<body>
		<p class="role">Tech Lead · Rio de Janeiro</p>
		<h1>Vinicius Oliveira</h1>
		<div class="rule"></div>
	</body>
</html>
